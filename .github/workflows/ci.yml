name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features highlight
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/editor.test.cjs
      - run: node --test tests/review.test.cjs
      - name: Review harness in headless Chrome
        run: cargo test --bin markview review_browser_harness -- --nocapture
        env:
          MARKVIEW_REQUIRE_BROWSER: 1

  macos-gui:
    name: macOS GUI checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features gui --all-targets -- -D warnings
      - run: cargo test --features gui
      - run: cargo build --features gui --bin markview-gui
